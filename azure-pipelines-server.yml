trigger:
  branches:
    include:
      - main
  paths:
    include:
      - server/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - azure-pipelines-server.yml

variables:
  # Keep the service connection generated by Azure DevOps
  azureSubscription: '4d88d89a-4a5e-4dcc-abbf-13516a70fcfd'

  webAppName: 'oleku-crm-api'
  environmentName: 'oleku-crm-api'
  vmImageName: 'ubuntu-latest'

stages:
  # ========================================
  # BUILD
  # ========================================
  - stage: Build
    displayName: Build backend

    jobs:
      - job: Build
        displayName: Build server

        pool:
          vmImage: $(vmImageName)

        steps:
          - task: UseNode@1
            displayName: 'Use Node.js 24'
            inputs:
              version: '24.x'

          - script: |
              corepack enable
              pnpm --version
            displayName: 'Enable pnpm'

          - script: |
              pnpm install --frozen-lockfile
            displayName: 'Install dependencies'

          - script: |
              pnpm --filter=server build
            displayName: 'Build server'

          - script: |
              pnpm --filter=server test
            displayName: 'Test server'

          # Create a clean standalone production package.
          # We intentionally use npm here instead of deploying pnpm's
          # node_modules structure because Azure App Service repackages
          # node_modules during startup.
          - script: |
              mkdir -p "$(Build.ArtifactStagingDirectory)/server"

              cp server/package.json \
                "$(Build.ArtifactStagingDirectory)/server/package.json"

              cp -R server/dist \
                "$(Build.ArtifactStagingDirectory)/server/dist"

              cd "$(Build.ArtifactStagingDirectory)/server"

              npm install --omit=dev
            displayName: 'Prepare production server'

          # Make sure the compiled entrypoint really exists
          - script: |
              test -f "$(Build.ArtifactStagingDirectory)/server/dist/main.js"
              echo "dist/main.js exists"
            displayName: 'Verify deployment package'

          - task: ArchiveFiles@2
            displayName: 'Archive backend'
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/server'
              includeRootFolder: false
              archiveType: zip
              archiveFile: '$(Build.ArtifactStagingDirectory)/server.zip'
              replaceExistingArchive: true

          - upload: '$(Build.ArtifactStagingDirectory)/server.zip'
            artifact: drop

  # ========================================
  # DEPLOY
  # ========================================
  - stage: Deploy
    displayName: Deploy backend
    dependsOn: Build
    condition: succeeded()

    jobs:
      - deployment: Deploy
        displayName: Deploy to Azure

        environment: $(environmentName)

        pool:
          vmImage: $(vmImageName)

        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy oleku-crm-api'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: webAppLinux
                    appName: $(webAppName)
                    runtimeStack: 'NODE|24-lts'
                    package: '$(Pipeline.Workspace)/drop/server.zip'
                    startUpCommand: 'npm run start'
